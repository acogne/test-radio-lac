name: Vidéos YouTube

# Met à jour videos.js depuis la playlist YouTube, toutes les 6 heures
# ou à la demande (onglet Actions > Vidéos YouTube > Run workflow).
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lire la playlist et écrire videos.js
        id: maj
        run: python .github/scripts/maj-videos.py

      - name: Commit si la liste a changé
        if: steps.maj.outputs.message != ''
        env:
          MESSAGE: ${{ steps.maj.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js
          git diff --cached --quiet && exit 0
          git commit -m "$MESSAGE"
          git push
